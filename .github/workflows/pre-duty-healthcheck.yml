name: Pre-Duty Developer Healthcheck to Telegram

on:
  schedule:
    # Berjalan setiap 10 menit selama jam sekolah (Senin - Jumat, 07.00 - 15.00 WIB / 00.00 - 08.00 UTC)
    - cron: '*/10 0-8 * * 1-5'
  workflow_dispatch: # Tombol 'Run workflow' manual untuk pengujian langsung kapan saja

jobs:
  pre-duty-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jalankan Pre-Duty Dynamic Healthcheck
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python duty_precheck_worker.py
